<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6A9CB8"/>
      <stop offset="100%" style="stop-color:#F5F2EB"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- Mountains -->
  <polygon points="0,250 150,150 300,200 450,120 600,180 800,140 800,400 0,400" fill="#2D5A3D"/>
  
  <!-- Village buildings -->
  <rect x="200" y="280" width="60" height="80" fill="#E8E4DA"/>
  <rect x="280" y="260" width="50" height="100" fill="#F5F2EB"/>
  <rect x="350" y="290" width="70" height="70" fill="#E8E4DA"/>
  <rect x="440" y="270" width="55" height="90" fill="#F5F2EB"/>
  <rect x="520" y="285" width="65" height="75" fill="#E8E4DA"/>
  
  <!-- Roofs -->
  <polygon points="200,280 230,250 260,280" fill="#8B4513"/>
  <polygon points="280,260 305,230 330,260" fill="#A0522D"/>
  <polygon points="350,290 385,260 420,290" fill="#8B4513"/>
  <polygon points="440,270 467,240 495,270" fill="#A0522D"/>
  <polygon points="520,285 552,255 585,285" fill="#8B4513"/>
  
  <!-- Church -->
  <rect x="380" y="240" width="40" height="120" fill="#F5F2EB"/>
  <polygon points="400,200 365,240 435,240" fill="#A0522D"/>
  <rect x="395" y="210" width="10" height="30" fill="#C9A227"/>
  
  <!-- Trees -->
  <circle cx="150" cy="340" r="30" fill="#3D7A52"/>
  <circle cx="650" cy="330" r="35" fill="#3D7A52"/>
  <circle cx="700" cy="350" r="25" fill="#2D5A3D"/>
</svg>
